[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "happiness_wealth"
version = "0.3.0"
description = "Wealth vs. happiness curves that kink into sharp diminishing returns."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["matplotlib", "numpy", "pandas"]

[project.scripts]
happiness-wealth = "happiness_wealth.plots:main"

[tool.setuptools]
packages = ["happiness_wealth"]
